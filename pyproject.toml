[project]
name = "uber-agent-automation-local"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "keyring==24.0.0",
    "twilio==9.10.6",
    "google-api-python-client>=2.120.0",
    "google-auth-oauthlib>=1.2.0",
    "playwright>=1.59.0",
    "boto3==1.34.0",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "pydantic[email]==2.7.1",
    "pydantic-settings==2.2.1",
    "pytest==8.0.0",
    "asyncio==4.0.0",
    "backports-tarfile==1.2.0",
    "jaraco-context==6.1.2",
    "jaraco-functools==4.4.0",
    "pytz==2026.2",
    "geopy>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "skills", "scripts"]
